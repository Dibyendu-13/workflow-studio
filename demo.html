<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Studio</title>
<style>
  :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20282c; background: #f5f7f5; }
  * { box-sizing: border-box; }
  main { max-width: 56rem; margin: 3rem auto; padding: 0 1.25rem; }
  h1 { margin: 0; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.05em; }
  p { line-height: 1.5; }
  form, article { background: white; border: 1px solid #d8e1db; border-radius: 1rem; padding: 1.25rem; }
  label { display: block; margin: .9rem 0 .35rem; font-weight: 650; }
  input, textarea, select { display: block; width: 100%; border: 1px solid #aab9b0; border-radius: .5rem; padding: .7rem; font: inherit; }
  textarea { resize: vertical; min-height: 12rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: 1rem; }
  button { font: inherit; font-weight: 650; padding: .65rem .9rem; border: 1px solid #27664d; border-radius: .5rem; cursor: pointer; }
  button[type="submit"] { background: #205a42; color: white; }
  button[type="button"] { background: white; color: #205a42; }
  button:disabled { opacity: .55; cursor: wait; }
  :focus-visible { outline: 3px solid #368c69; outline-offset: 3px; }
  article { margin: .75rem 0; overflow-wrap: anywhere; }
  article h3 { margin: 0 0 .35rem; }
  article p { margin: .35rem 0; }
  blockquote { margin: .75rem 0 0; padding-left: .75rem; border-left: 3px solid #9eb7a7; color: #3c5144; }
  .review { color: #80420b; font-weight: 650; }
  #status { min-height: 1.5rem; }
  .project-tabs { display: flex; flex-wrap: wrap; gap: .5rem; margin: 1.35rem 0 1.5rem; }
  button[role="tab"] { border-color: #b3c4ba; font-size: .875rem; }
  button[role="tab"][aria-selected="true"] { background: #205a42; color: white; }
  .plan h2 { margin-top: 0; }
  .plan h3 { margin-top: 1.15rem; }
  .plan { margin-top: 1.5rem; }
  .plan pre { overflow-x: auto; padding: 1rem; background: #edf3ee; border-radius: .5rem; }
  summary { cursor: pointer; font-weight: 650; }
  output { display: block; margin-top: .8rem; }
  .demo-results { display: grid; gap: .8rem; margin-top: 1rem; }
  .demo-results article { margin: 0; white-space: pre-wrap; }
  .demo-media { display: block; max-width: 100%; border-radius: .5rem; margin-bottom: .6rem; }
  .image-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); }
  .image-grid figure { margin: 0; }
  .image-grid img { width: 100%; height: auto; display: block; border-radius: .6rem; }
  .image-grid figcaption { margin: .35rem 0; }
  input[type="checkbox"] { width: auto; display: inline; }
</style>
</head>
<body>
<main>
  <h1>Workflow Studio</h1>
  <div class="project-tabs" role="tablist" aria-label="Project requirements">
    <button type="button" role="tab" id="tab-1" aria-controls="panel-1" aria-selected="true">1 · Ops Brain</button>
    <!-- PROJECT_TABS -->
  </div>
  <section role="tabpanel" id="panel-1" aria-labelledby="tab-1">
  <h2>Ops Brain</h2>
  <p>Turn a meeting note into task proposals for human review.</p>
  <p><a href="#ops-build-plan">Jump to the v1 build plan</a></p>
  <form>
    <label for="goal">Goal ID</label>
    <input id="goal" required maxlength="120" placeholder="launch_storefront">
    <label for="note">Meeting note</label>
    <textarea id="note" required maxlength="20000" placeholder="Paste a meeting note or load the fictional sample."></textarea>
    <div class="actions">
      <button type="submit">Extract tasks</button>
      <button id="sample" type="button">Load sample</button>
    </div>
  </form>
  <p id="status" role="status"></p>
  <section id="results" aria-label="Task proposals"></section>
  <article id="ops-build-plan" class="plan" aria-labelledby="ops-plan-title">
    <h2 id="ops-plan-title">Ops Brain v1 build plan</h2>
    <!-- OPS_BUILD_PLAN -->
  </article>
  </section>
  <!-- PROJECT_PANELS -->
</main>
<!-- DEMO_TEMPLATES -->
<script type="module">
  import { mountProjectDemos } from "/project_demos.js";
  mountProjectDemos(document);
</script>
<script>
const tabs = [...document.querySelectorAll('[role="tab"]')];
function selectTab(tab) {
  for (const item of tabs) {
    const selected = item === tab;
    item.setAttribute("aria-selected", String(selected));
    item.tabIndex = selected ? 0 : -1;
    document.getElementById(item.getAttribute("aria-controls")).hidden = !selected;
  }
}
for (const [index, tab] of tabs.entries()) {
  tab.addEventListener("click", () => selectTab(tab));
  tab.addEventListener("keydown", (event) => {
    const positions = {
      ArrowRight: (index + 1) % tabs.length,
      ArrowLeft: (index + tabs.length - 1) % tabs.length,
      Home: 0,
      End: tabs.length - 1
    };
    if (!Object.hasOwn(positions, event.key)) return;
    event.preventDefault();
    const next = tabs[positions[event.key]];
    selectTab(next);
    next.focus();
  });
}

const goal = document.querySelector("#goal");
const note = document.querySelector("#note");
const status = document.querySelector("#status");
const results = document.querySelector("#results");
const submit = document.querySelector('button[type="submit"]');
const sampleButton = document.querySelector("#sample");

sampleButton.addEventListener("click", async () => {
  try {
    const response = await fetch("/sample");
    if (!response.ok) throw new Error("Could not load the sample.");
    const sample = await response.json();
    goal.value = sample.goal;
    note.value = sample.note;
    results.replaceChildren();
    status.textContent = "Sample loaded.";
  } catch (error) {
    status.textContent = error.message;
  }
});

document.querySelector("form").addEventListener("submit", async (event) => {
  event.preventDefault();
  submit.disabled = sampleButton.disabled = true;
  results.replaceChildren();
  status.textContent = "Extracting proposals…";
  try {
    const response = await fetch("/extract", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({goal: goal.value, note: note.value})
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    const titles = new Map(data.tasks.map(task => [task.task_id, task.title]));
    for (const task of data.tasks) {
      const card = document.createElement("article");
      function add(tag, text, className) {
        const element = document.createElement(tag);
        element.textContent = text;
        if (className) element.className = className;
        card.append(element);
      }
      add("h3", task.title);
      add("p", `Owner · ${task.owner ?? "Unassigned"} | Due · ${task.due_date ?? "Unconfirmed"}`);
      add("p", `Goal · ${task.goal_id}`);
      add("p", `Depends on · ${task.depends_on.map(id => titles.get(id)).join(", ") || "None"}`);
      if (task.needs_review) add("p", `Needs review · ${task.review_notes.join(" ")}`, "review");
      add("blockquote", task.source_excerpt);
      results.append(card);
    }
    status.textContent = `${data.tasks.length} task proposals`;
  } catch (error) {
    status.textContent = error.message;
  } finally {
    submit.disabled = sampleButton.disabled = false;
  }
});
</script>
</body>
</html>
